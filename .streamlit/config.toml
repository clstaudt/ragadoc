[theme]
# Set dark theme as default
base = "dark"
primaryColor = "#FFB000"  # Gold accent matching darkstreaming theme
backgroundColor = "#121212"  # Dark background matching darkstreaming theme
secondaryBackgroundColor = "#1a1a1a"  # Surface background matching darkstreaming theme
textColor = "#ffffff"  # White text matching darkstreaming theme

[browser]
# Gather usage stats for better performance insights
gatherUsageStats = false

[server]
# Keep CORS enabled; disabling both CORS and XSRF causes Streamlit to silently
# re-enable them, which breaks st.file_uploader with a 413 AxiosError.
# See: https://github.com/streamlit/streamlit/issues/8983
enableCORS = true
enableXsrfProtection = false

# Explicit upload/message limits (MB) to avoid 413s on the websocket path.
maxUploadSize = 500
maxMessageSize = 500

# File watcher settings for better development experience
fileWatcherType = "auto"
runOnSave = false

[client]
# Display connection status for debugging
showErrorDetails = true 